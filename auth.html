<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safe Bucket | Account</title>
  <style>
/* ============================================================
   SAFE BUCKET — AUTHENTICATION THEME
   Matching the main website's green game hub style
   ============================================================ */

:root {
    color-scheme: dark;

    --bg: #101210;
    --panel: #191c19;
    --panel2: #222622;
    --panel3: #2a302a;
    --line: #303730;

    --text: #f2f5f0;
    --muted: #9ca69b;
    --white: #ffffff;

    --accent: #76b900;
    --accent-light: #a3e635;
    --accent-dark: #496f00;

    --danger: #ff626e;

    --radius: 12px;
    --shadow: 0 18px 55px #0008;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html {
    min-height: 100%;
    background: var(--bg);
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background:
        radial-gradient(
            ellipse at 50% -30%,
            #293421 0,
            transparent 55%
        ),
        radial-gradient(
            circle at 50% 45%,
            #1b271b 0,
            transparent 65%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    color: inherit;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

button:focus-visible,
input:focus-visible {
    outline: 2px solid var(--accent-light);
    outline-offset: 3px;
}

/* ============================================================
   AUTHENTICATION CARD
   ============================================================ */

.auth-container,
.auth-card,
.container,
.card {
    position: relative;

    width: min(440px, 100%);
    margin: auto;
    padding: 32px;

    overflow: hidden;

    border: 1px solid #45533d;
    border-radius: 18px;

    background:
        radial-gradient(
            ellipse at 50% 0%,
            #76b90012,
            transparent 55%
        ),
        linear-gradient(145deg, #202620, #121612);

    box-shadow:
        0 35px 100px #000b,
        inset 0 1px 0 #ffffff12;

    animation: authCardIn .4s ease;
}

@keyframes authCardIn {
    from {
        opacity: 0;
        transform: translateY(14px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ============================================================
   HEADINGS AND TEXT
   ============================================================ */

h1 {
    margin-bottom: 10px;

    color: var(--text);

    font-size: 28px;
    font-weight: 850;
    letter-spacing: -1px;
    line-height: 1.15;
}

h2 {
    margin-bottom: 12px;

    color: var(--text);

    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.5px;
}

h3 {
    margin-bottom: 8px;

    color: var(--text);

    font-size: 15px;
    font-weight: 750;
}

p {
    color: var(--muted);

    font-size: 12px;
    line-height: 1.7;
}

label {
    display: block;
    margin-bottom: 7px;

    color: #cbd6c5;

    font-size: 11px;
    font-weight: 700;
}

/* ============================================================
   INPUTS
   ============================================================ */

input[type="text"],
input[type="email"],
input[type="password"] {
    display: block;

    width: 100%;
    height: 46px;
    padding: 0 13px;
    margin-bottom: 15px;

    border: 1px solid #384236;
    border-radius: 9px;

    outline: none;

    background: #111611;
    color: var(--text);

    font-size: 13px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

input::placeholder {
    color: #657060;
}

input:hover {
    border-color: #52604c;
}

input:focus {
    border-color: var(--accent);

    background: #151b15;

    box-shadow:
        0 0 0 3px #76b90020,
        0 0 18px #76b9000b;

    outline: none;
}

/* ============================================================
   BUTTONS
   ============================================================ */

button,
.button {
    min-height: 44px;
    padding: 11px 15px;

    border: 1px solid var(--line);
    border-radius: 9px;

    background: var(--panel2);
    color: var(--text);

    font-size: 12px;
    font-weight: 750;

    cursor: pointer;

    transition:
        transform .2s ease,
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

button:hover:not(:disabled),
.button:hover {
    transform: translateY(-1px);

    border-color: #668d2d;

    background: #28351b;
    color: var(--accent-light);
}

button:active:not(:disabled) {
    transform: scale(.98);
}

/* Primary authentication buttons */

#signInButton,
#loginButton,
#signUpButton,
#createAccountButton,
#googleSignInButton {
    width: 100%;
    margin-top: 8px;
}

/* Green primary buttons */

#signInButton,
#loginButton,
#signUpButton,
#createAccountButton {
    border-color: var(--accent);

    background: var(--accent);
    color: #10150a;
}

#signInButton:hover:not(:disabled),
#loginButton:hover:not(:disabled),
#signUpButton:hover:not(:disabled),
#createAccountButton:hover:not(:disabled) {
    border-color: var(--accent-light);

    background: var(--accent-light);
    color: #10150a;

    box-shadow:
        0 8px 20px #76b90033,
        0 0 0 3px #76b90018;
}

/* Google button */

#googleSignInButton {
    border-color: #45533d;

    background: #191d19;
    color: var(--text);
}

#googleSignInButton:hover:not(:disabled) {
    border-color: #668d2d;
    background: #222a20;
    color: var(--text);
}

/* Sign out button */

#signOutButton,
#logoutButton {
    width: 100%;
    margin-top: 12px;

    border-color: #633a3e;
    background: #28191b;
    color: #ff9ba3;
}

#signOutButton:hover:not(:disabled),
#logoutButton:hover:not(:disabled) {
    border-color: var(--danger);
    background: #382023;
    color: #ffb0b6;
}

/* ============================================================
   SPACING BETWEEN FORM ELEMENTS
   ============================================================ */

form {
    width: 100%;
}

form button {
    display: block;
}

hr {
    height: 1px;
    margin: 20px 0;

    border: 0;
    background: var(--line);
}

.auth-divider,
.divider {
    display: flex;
    align-items: center;
    gap: 12px;

    margin: 18px 0;

    color: var(--muted);
    font-size: 10px;
}

.auth-divider::before,
.auth-divider::after,
.divider::before,
.divider::after {
    content: "";

    height: 1px;
    flex: 1;

    background: var(--line);
}

/* ============================================================
   STATUS MESSAGES
   ============================================================ */

#message,
#status,
#statusMessage {
    margin-top: 14px;
    padding: 11px 12px;

    border: 1px solid var(--line);
    border-radius: 9px;

    background: #151b15;
    color: var(--muted);

    font-size: 11px;
    line-height: 1.6;

    overflow-wrap: anywhere;
}

.error,
.error-message {
    border-color: #633a3e;
    background: #28191b;
    color: #ff9ba3;
}

.success,
.success-message {
    border-color: #496f00;
    background: #182018;
    color: var(--accent-light);
}

/* ============================================================
   ACCOUNT INFORMATION
   ============================================================ */

#accountSection,
.account-section,
.account-info {
    margin-top: 20px;
    padding: 17px;

    border: 1px solid var(--line);
    border-radius: 12px;

    background: #151b15;
}

#accountSection h2,
.account-section h2 {
    margin-bottom: 12px;
}

#accountInfo {
    overflow-wrap: anywhere;

    color: #cbd6c5;

    font-size: 12px;
    line-height: 1.9;
}

#accountInfo strong {
    color: var(--accent-light);
}

/* ============================================================
   LINKS
   ============================================================ */

a {
    color: var(--accent-light);
    text-decoration: none;

    transition:
        color .2s ease,
        text-shadow .2s ease;
}

a:hover {
    color: var(--white);
    text-shadow: 0 0 12px #a3e63544;
}

.back-link,
.backLink {
    display: block;

    margin-top: 22px;

    color: var(--muted);

    font-size: 11px;
    text-align: center;
}

.back-link:hover,
.backLink:hover {
    color: var(--accent-light);
}

/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 480px) {
    body {
        padding: 15px;
    }

    .auth-container,
    .auth-card,
    .container,
    .card {
        width: 100%;
        padding: 23px 19px;

        border-radius: 15px;
    }

    h1 {
        font-size: 25px;
    }

    h2 {
        font-size: 19px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
        height: 45px;
    }

    button,
    .button {
        min-height: 43px;
    }
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
    </style>
</head>
<body>
<main class="card">
<h1>Safe Bucket</h1>
<p id="subtitle">Create your account or sign in.</p>

<label for="username">Username (for new accounts)</label>
<input id="username" maxlength="20" placeholder="Choose a username"
autocomplete="username">

<form id="form">
<input id="email" type="email" placeholder="Email address"
autocomplete="email" required>
<input id="password" type="password" placeholder="Password"
autocomplete="current-password" minlength="6" required>
<button id="login" type="submit">Sign In</button>
<button id="signup" type="button">Create Account</button>
</form>

<button id="google" class="secondary" type="button">
Continue with Google
</button>
<p id="message" role="status">New accounts start as Member.</p>
<div id="account" hidden>
<p id="accountInfo"></p>
<button id="logout" class="secondary" type="button">Sign Out</button>
</div>
<p><a href="./index.html">Back to Safe Bucket</a></p>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
getAuth,onAuthStateChanged,createUserWithEmailAndPassword,
signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,
signOut,updateProfile
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
getDatabase,ref,get,set,runTransaction,update
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const app=initializeApp({
apiKey:"AIzaSyCkJJcpdLfWH8XZBuT8tgOkOKuj6ZtEzcY",
authDomain:"safebucketbypass.firebaseapp.com",
databaseURL:"https://safebucketbypass-default-rtdb.firebaseio.com",
projectId:"safebucketbypass",
storageBucket:"safebucketbypass.firebasestorage.app",
messagingSenderId:"659506734507",
appId:"1:659506734507:web:1e4268f7746380b41bdeee"
});
const auth=getAuth(app),db=getDatabase(app);
const provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);
const message=$("message");

function say(text){message.textContent=text}
function cleanUsername(value){return value.trim()}
function validUsername(name){
return /^[a-zA-Z0-9_]{3,20}$/.test(name);
}
function errorText(e){
const errors={
"auth/email-already-in-use":"That email already has an account.",
"auth/invalid-email":"Enter a valid email address.",
"auth/weak-password":"Use a stronger password.",
"auth/invalid-credential":"Email or password is incorrect.",
"auth/unauthorized-domain":"This domain is not authorized in Firebase.",
"PERMISSION_DENIED":"Firebase database rules denied this action."
};
say(errors[e.code]||e.message||"Something went wrong.");
}

async function ensureProfile(user,requestedName){
const userRef=ref(db,"users/"+user.uid);
const existing=await get(userRef);

if(existing.exists()){
say("Welcome back, "+(existing.val().username||"Member")+"!");
return;
}

const username=cleanUsername(requestedName||"");
if(!validUsername(username)){
throw new Error("Choose a username with 3–20 letters, numbers, or underscores.");
}
const lower=username.toLowerCase();
const claim=await runTransaction(ref(db,"usernames/"+lower),current=>{
return current===null?user.uid:undefined;
});

if(!claim.committed){
throw new Error("That username is already taken. Try another.");
}

try{
await set(userRef,{
username:username,
usernameLower:lower,
displayName:username,
photoURL:user.photoURL||"",
rank:"Member",
favoriteGames:[],
createdAt:Date.now(),
totalTimeSeconds:0
});
if(user.displayName!==username){
await updateProfile(user,{displayName:username});
}
say("Account created! Welcome to Safe Bucket, "+username+".");
}catch(e){
say("Your username may have been reserved, but profile setup failed. Please tell the site owner this error: "+e.message);
throw e;
}
}

$("form").addEventListener("submit",async e=>{
e.preventDefault();
$("login").disabled=true;
try{
const result=await signInWithEmailAndPassword(
auth,$("email").value.trim(),$("password").value);
const snap=await get(ref(db,"users/"+result.user.uid));
if(!snap.exists()){
say("You're signed in, but your profile isn't set up yet. Sign out and contact the site owner.");
return;
}
say("Signed in as "+snap.val().username+".");
}catch(e){errorText(e)}
finally{$("login").disabled=false}
});

$("signup").addEventListener("click",async()=>{
const username=cleanUsername($("username").value);
if(!validUsername(username)){
say("Username must be 3–20 characters using letters, numbers, or underscores.");
return;
}
if(!$("form").reportValidity())return;
$("signup").disabled=true;
try{
const result=await createUserWithEmailAndPassword(
auth,$("email").value.trim(),$("password").value);
await ensureProfile(result.user,username);
}catch(e){errorText(e)}
finally{$("signup").disabled=false}
});

$("google").addEventListener("click",async()=>{
const username=cleanUsername($("username").value);
$("google").disabled=true;
try{
const result=await signInWithPopup(auth,provider);
const snap=await get(ref(db,"users/"+result.user.uid));
if(snap.exists()){
say("Welcome back, "+snap.val().username+"!");
}else{
if(!validUsername(username)){
await signOut(auth);
say("Choose a username first, then tap Continue with Google again.");
return;
}
await ensureProfile(result.user,username);
}
}catch(e){errorText(e)}
finally{$("google").disabled=false}
});

$("logout").addEventListener("click",async()=>{
try{await signOut(auth);say("You have signed out.")}
catch(e){errorText(e)}
});

onAuthStateChanged(auth,async user=>{
$("account").hidden=!user;
$("form").hidden=!!user;
$("signup").hidden=!!user;
$("google").hidden=!!user;
$("username").hidden=!!user;
$("subtitle").textContent=user?"Your Safe Bucket account":"Create your account or sign in.";
if(user){
try{
const snap=await get(ref(db,"users/"+user.uid));
$("accountInfo").textContent=snap.exists()
?"Username: "+snap.val().username+" | Rank: "+snap.val().rank
:"Signed in, but profile setup is incomplete.";
}catch(e){$("accountInfo").textContent="Signed in. Profile could not be loaded."}
}
});
</script>
</body>
</html>
