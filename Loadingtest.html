
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meld Proxy</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101010;
    font-family: Arial, sans-serif;
}

#initializer {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    border: none;
}

#destination {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: white;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #101010;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    transition: opacity .5s ease;
}

#loading.hidden {
    opacity: 0;
    pointer-events: none;
}

.logo {
    color: #b6ff00;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 5px;
}

.subtitle {
    color: #777;
    font-size: 11px;
    letter-spacing: 3px;
}

.spinner {
    width: 35px;
    height: 35px;
    border: 3px solid #292929;
    border-top-color: #b6ff00;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<iframe id="initializer" src="about:blank"></iframe>

<iframe id="destination" src="about:blank"></iframe>

<div id="loading">
    <img src="Icons/Meld.png">
    <div class="logo">Meld Proxy</div>
    <div class="spinner"></div>
    <div class="subtitle" id="status">INITIALIZING PROXY</div>
</div>

<script>
const initializer = document.getElementById("initializer");
const destination = document.getElementById("destination");
const loading = document.getElementById("loading");
const status = document.getElementById("status");

const target =
"https://amethyst.zone/scram/service/https%3A%2F%2Fwww.google.com";

let destinationLoaded = false;
let reloadDone = false;
let finished = false;

function finishLoading() {
    if (finished) return;
    finished = true;

    loading.classList.add("hidden");

    setTimeout(() => {
        loading.style.display = "none";
    }, 500);
}

destination.onload = () => {
    if (!destinationLoaded) {
        destinationLoaded = true;

        status.textContent = "RELOADING DESTINATION";

        reloadDone = true;
        destination.src = target;

    } else if (reloadDone) {
        finishLoading();
    }
};

initializer.onload = () => {
    status.textContent = "CONNECTING TO DESTINATION";

    destination.src = target;
};

initializer.src = "https://amethyst.zone/browse";

</script>

</body>
</html>
