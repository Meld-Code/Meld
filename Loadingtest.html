
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meld Proxy</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101010;
    font-family: Arial, sans-serif;
}

#initializer {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    border: none;
}

#destination {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: white;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #101010;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    transition: opacity .5s ease;
}

#loading.hidden {
    opacity: 0;
    pointer-events: none;
}

.logo {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #b6ff00;
}

.subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    color: #777;
}

.spinner {
    width: 35px;
    height: 35px;
    border: 3px solid #292929;
    border-top-color: #b6ff00;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<iframe
    id="initializer"
    src="https://amethyst.zone/browse">
</iframe>

<iframe
    id="destination"
    src="about:blank">
</iframe>

<div id="loading">
    <div class="logo">MELD</div>
    <div class="spinner"></div>
    <div class="subtitle">INITIALIZING PROXY</div>
</div>

<script>
const destination = document.getElementById("destination");
const loading = document.getElementById("loading");

const target =
"https://amethyst.zone/scram/service/https%3A%2F%2Fwww.google.com";

// Immediately load the destination underneath the overlay
destination.src = target;

// Once the iframe fires its load event, hide the overlay
destination.addEventListener("load", () => {
    if (destination.src !== "about:blank") {
        loading.classList.add("hidden");

        setTimeout(() => {
            loading.style.display = "none";
        }, 500);
    }
});

</script>

</body>
</html>
