
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meld Proxy</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101010;
    font-family: Arial, sans-serif;
}

#initializer {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

#destination {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: white;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #101010;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity .4s ease;
}

#loading.hidden {
    opacity: 0;
    pointer-events: none;
}

.logo {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #b6ff00;
    text-shadow: 0 0 25px #b6ff0040;
}

.subtitle {
    color: #777;
    font-size: 12px;
    margin-top: 12px;
    letter-spacing: 2px;
}

.spinner {
    width: 27px;
    height: 27px;
    margin-top: 32px;
    border: 3px solid #292929;
    border-top-color: #b6ff00;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<iframe id="initializer" src="about:blank"></iframe>

<iframe id="destination" src="about:blank"></iframe>

<div id="loading">
    <div class="logo">MELD</div>
    <div class="subtitle">PROXY CONNECTION</div>
    <div class="spinner"></div>
</div>

<script>
const initializer = document.getElementById("initializer");
const destination = document.getElementById("destination");
const loading = document.getElementById("loading");

const target =
"https://amethyst.zone/scram/service/https%3A%2F%2Fwww.google.com";

let firstLoad = false;
let finished = false;

// Step 5: Hide loading screen
function finishLoading() {
    if (finished) return;
    finished = true;

    loading.classList.add("hidden");
}

// Step 3 and 4: Load, then reload destination
destination.onload = () => {
    if (!firstLoad) {
        firstLoad = true;
        destination.src = target;
    } else {
        finishLoading();
    }
};

// Step 2: Initialize Amethyst
initializer.onload = () => {
    destination.src = target;
};

// Step 1: Start loading
initializer.src = "https://amethyst.zone/browse";

</script>

</body>
</html>
