
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Latency Simulator</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      color: white;
      background: #111b;
      padding: 14px;
      border-radius: 10px;
      z-index: 2;
      line-height: 1.6;
    }

    #hud strong { color: #ff962e; }

    #help {
      position: fixed;
      bottom: 16px;
      left: 16px;
      color: white;
      background: #111b;
      padding: 10px;
      border-radius: 8px;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="hud">
    <strong>LATENCY SIMULATOR</strong><br>
    Ping: <span id="ping">150</span> ms<br>
    Ghost delay: <span id="delay">150</span> ms<br>
    <label>
      Latency
      <input id="latency" type="range"
             min="50" max="1000" value="150">
    </label><br>
    <span style="color:#ff962e">■</span> Delayed position
  </div>

  <div id="help">
    WASD: Move · Space: Jump · Mouse: Rotate camera
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------------- SCENE ----------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 35, 100);

    const camera = new THREE.PerspectiveCamera(
      70, innerWidth / innerHeight, 0.1, 500
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 2));

    const sunlight = new THREE.DirectionalLight(0xffffff, 2);
    sunlight.position.set(8, 15, 8);
    sunlight.castShadow = true;
    scene.add(sunlight);

    // ---------------- WORLD ----------------

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x62a94e })
    );

    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(200, 100, 0x4d8d43, 0x599448);
    grid.position.y = 0.015;
    scene.add(grid);

    // ---------------- ROBLOX-STYLE AVATAR ----------------

    function makeCharacter(ghost = false) {
      const root = new THREE.Group();
      const body = new THREE.Group();
      root.add(body);

      const material = (color) => new THREE.MeshStandardMaterial({
        color,
        transparent: ghost,
        opacity: ghost ? 0.42 : 1,
        depthWrite: !ghost,
        roughness: 0.75
      });

      const orange = material(0xff7a00);

      function block(parent, size, position, mat, name) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(...size), mat
        );

        mesh.position.set(...position);
        mesh.castShadow = !ghost;
        mesh.receiveShadow = !ghost;
        mesh.name = name || '';
        parent.add(mesh);
        return mesh;
      }

      // Body, head and classic block-shaped limbs
      block(body, [1.15, 1.25, 0.55], [0, 1.65, 0],
        ghost ? orange : material(0x1769df), 'Torso');

      const head = block(body, [0.85, 0.85, 0.85],
        [0, 2.75, 0],
        ghost ? orange : material(0xffcc99), 'Head');

      if (!ghost) {
        // Simple face on the front of the head (-Z)
        const face = new THREE.Group();
        face.position.set(0, 2.75, -0.431);
        body.add(face);

        const eyeMat = material(0x222222);
        block(face, [0.09, 0.09, 0.025],
          [-0.19, 0.08, 0], eyeMat);
        block(face, [0.09, 0.09, 0.025],
          [0.19, 0.08, 0], eyeMat);
        block(face, [0.23, 0.045, 0.025],
          [0, -0.14, 0], eyeMat);
      }

      const limbs = [];

      function limb(name, x, y, z, color) {
        const pivot = new THREE.Group();
        pivot.position.set(x, y, z);
        body.add(pivot);

        block(pivot, [0.4, 0.95, 0.45],
          [0, -0.475, 0],
          ghost ? orange : material(color), name);

        limbs.push(pivot);
        return pivot;
      }

      const leftArm  = limb('Left Arm', -0.78, 2.15, 0, 0xffcc99);
      const rightArm = limb('Right Arm', 0.78, 2.15, 0, 0xffcc99);
      const leftLeg  = limb('Left Leg', -0.31, 1.02, 0, 0x333b55);
      const rightLeg = limb('Right Leg', 0.31, 1.02, 0, 0x333b55);

      root.userData.body = body;
      root.userData.limbs = limbs;
      root.userData.legs = [leftLeg, rightLeg];
      root.userData.arms = [leftArm, rightArm];

      return root;
    }

    const player = makeCharacter(false);
    scene.add(player);

    const ghost = makeCharacter(true);
    scene.add(ghost);

    // ---------------- INPUT ----------------

    const keys = {};
    let yaw = 0;
    let cameraPitch = 0.18;
    let verticalVelocity = 0;
    let grounded = true;
    let walkTime = 0;

    addEventListener('keydown', e => {
      keys[e.code] = true;

      if (e.code === 'Space') {
        e.preventDefault();
        if (grounded) {
          verticalVelocity = 8;
          grounded = false;
        }
      }
    });

    addEventListener('keyup', e => keys[e.code] = false);

    // Click and drag to rotate the camera
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    renderer.domElement.addEventListener('pointerdown', e => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    });

    renderer.domElement.addEventListener('pointerup', () => {
      dragging = false;
    });

    renderer.domElement.addEventListener('pointermove', e => {
      if (!dragging) return;

      yaw -= (e.clientX - lastX) * 0.006;
      cameraPitch += (e.clientY - lastY) * 0.004;
      cameraPitch = THREE.MathUtils.clamp(cameraPitch, -0.3, 0.8);

      lastX = e.clientX;
      lastY = e.clientY;
    });

    // ---------------- LATENCY HISTORY ----------------

    const slider = document.getElementById('latency');
    const pingLabel = document.getElementById('ping');
    const delayLabel = document.getElementById('delay');

    let latency = Number(slider.value);
    slider.addEventListener('input', () => {
      latency = Number(slider.value);
      pingLabel.textContent = latency;
      delayLabel.textContent = latency;
    });

    // Save historical transforms so the ghost can replay them later.
    const history = [];
    const clock = new THREE.Clock();

    function getSnapshot(time) {
      return {
        time,
        position: player.position.clone(),
        rotation: player.rotation.y,
        limbRotations: player.userData.limbs.map(
          limb => limb.rotation.x
        )
      };
    }

    // ---------------- GAME LOOP ----------------

    const direction = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const targetCamera = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const now = performance.now();

      // Movement relative to camera direction
      forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
      right.set(Math.cos(yaw), 0, -Math.sin(yaw));

      direction.set(0, 0, 0);

      if (keys.KeyW) direction.add(forward);
      if (keys.KeyS) direction.sub(forward);
      if (keys.KeyD) direction.add(right);
      if (keys.KeyA) direction.sub(right);

      const moving = direction.lengthSq() > 0;

      if (moving) {
        direction.normalize();
        player.position.addScaledVector(direction, 6 * dt);

        // Face the direction of movement
        player.rotation.y = Math.atan2(
          -direction.x, -direction.z
        );

        walkTime += dt * 10;

        player.userData.legs[0].rotation.x =
          Math.sin(walkTime) * 0.65;
        player.userData.legs[1].rotation.x =
          -Math.sin(walkTime) * 0.65;

        player.userData.arms[0].rotation.x =
          -Math.sin(walkTime) * 0.5;
        player.userData.arms[1].rotation.x =
          Math.sin(walkTime) * 0.5;
      } else {
        player.userData.limbs.forEach(limb => {
          limb.rotation.x = THREE.MathUtils.damp(
            limb.rotation.x, 0, 10, dt
          );
        });
      }

      // Jump physics
      verticalVelocity -= 22 * dt;
      player.position.y += verticalVelocity * dt;

      if (player.position.y <= 0) {
        player.position.y = 0;
        verticalVelocity = 0;
        grounded = true;
      }

      // Keep a record of past player transforms
      history.push(getSnapshot(now));

      // Replay the player state from the configured delay ago
      const targetTime = now - latency;

      while (history.length > 2 &&
             history[1].time <= targetTime) {
        history.shift();
      }

      if (history.length > 0) {
        let a = history[0];
        let b = history[1] || a;

        const span = b.time - a.time;
        const t = span > 0
          ? THREE.MathUtils.clamp(
              (targetTime - a.time) / span, 0, 1
            )
          : 0;

        ghost.position.lerpVectors(a.position, b.position, t);

        // Interpolate facing direction smoothly
        ghost.rotation.y = a.rotation +
          THREE.MathUtils.euclideanModulo(
            b.rotation - a.rotation + Math.PI,
            Math.PI * 2
          ) * t - Math.PI;

        ghost.userData.limbs.forEach((limb, i) => {
          limb.rotation.x = THREE.MathUtils.lerp(
            a.limbRotations[i],
            b.limbRotations[i], t
          );
        });
      }

      // Third-person follow camera
      targetCamera.set(
        player.position.x + Math.sin(yaw) * 8,
        player.position.y + 5 + cameraPitch * 3,
        player.position.z + Math.cos(yaw) * 8
      );

      camera.position.lerp(targetCamera, 1 - Math.exp(-5 * dt));

      const lookAt = player.position.clone();
      lookAt.y += 1.5;
      camera.lookAt(lookAt);

      // Keep enough history for the maximum configured delay
      while (history.length > 2 &&
             history[1].time < now - 1200) {
        history.shift();
      }

      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    pingLabel.textContent = latency;
    delayLabel.textContent = latency;

    animate();
  </script>
</body>
</html>
