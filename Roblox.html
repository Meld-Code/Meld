
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R6 Latency Simulator</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #dedede;
}

#hud {
  position: fixed;
  z-index: 5;
  top: 14px;
  left: 14px;
  width: 235px;
  padding: 14px;
  border-radius: 10px;
  color: white;
  background: #171717df;
  line-height: 1.8;
}

#hud strong { color: #ff8a22; }
#latency { width: 100%; accent-color: #ff8a22; }

#help {
  position: fixed;
  bottom: 14px;
  left: 14px;
  z-index: 5;
  padding: 10px 14px;
  border-radius: 8px;
  color: white;
  background: #171717df;
  font-size: 13px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="hud">
  <strong>ROBLOX R6 LATENCY</strong><br>
  Simulated ping: <span id="ping">150</span> ms<br>
  Ghost delay: <span id="delay">150</span> ms<br>
  <label for="latency">Latency</label>
  <input id="latency" type="range"
         min="50" max="1000" step="10" value="150">
  <span style="color:#ff8a22">■</span> Delayed character
</div>

<div id="help">
  WASD: Move · Space: Jump · Drag: Look · Wheel: Zoom
</div>

<script type="module">
import * as THREE from 'three';

// ======================================
// SCENE
// ======================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdedede);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(8, 15, 10);
sun.castShadow = true;
scene.add(sun);

// ======================================
// GROUND
// ======================================

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({
    color: 0xd0d0d0,
    roughness: 1
  })
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(
  300, 100, 0xb0b0b0, 0xc7c7c7
);
grid.position.y = 0.01;
scene.add(grid);

// ======================================
// R6 CHARACTER
// Scale: 1 unit = 28 cm
// ======================================

function createCharacter(isGhost = false) {
  const root = new THREE.Group();
  const model = new THREE.Group();
  root.add(model);

  const material = new THREE.MeshStandardMaterial({
    color: isGhost ? 0xff851f : 0x999999,
    transparent: isGhost,
    opacity: isGhost ? 0.42 : 1,
    depthWrite: !isGhost,
    roughness: 0.9
  });

  // Invisible HumanoidRootPart representation
  root.userData.rootPartSize = new THREE.Vector3(2, 2, 1);

  function box(name, size, position, parent = model) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(...size),
      material
    );

    mesh.name = name;
    mesh.position.set(...position);
    mesh.castShadow = !isGhost;
    mesh.receiveShadow = !isGhost;
    parent.add(mesh);
    return mesh;
  }

  // Cylindrical head: 2 x 1 x 1.
  // The cylinder's long axis is X to match these dimensions.
  const head = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, 2, 24),
    material
  );

  head.name = 'Head';
  head.rotation.z = Math.PI / 2;
  head.position.set(0, 4.5, 0);
  head.castShadow = !isGhost;
  head.receiveShadow = !isGhost;
  model.add(head);

  // Torso: 2 x 2 x 1
  box('Torso', [2, 2, 1], [0, 3, 0]);

  // Arms: 1 x 2 x 1
  function makeArm(name, x) {
    const pivot = new THREE.Group();
    pivot.position.set(x, 4, 0);
    model.add(pivot);
    box(name, [1, 2, 1], [0, -1, 0], pivot);
    return pivot;
  }

  const leftArm = makeArm('Left Arm', -1.5);
  const rightArm = makeArm('Right Arm', 1.5);

  // Legs: 1 x 2 x 1
  function makeLeg(name, x) {
    const pivot = new THREE.Group();
    pivot.position.set(x, 2, 0);
    model.add(pivot);
    box(name, [1, 2, 1], [0, -1, 0], pivot);
    return pivot;
  }

  const leftLeg = makeLeg('Left Leg', -0.5);
  const rightLeg = makeLeg('Right Leg', 0.5);

  root.userData.arms = [leftArm, rightArm];
  root.userData.legs = [leftLeg, rightLeg];
  root.userData.limbs = [
    leftArm, rightArm, leftLeg, rightLeg
  ];

  return root;
}

const player = createCharacter(false);
const ghost = createCharacter(true);

scene.add(player, ghost);

// ======================================
// KEYBOARD INPUT
// ======================================

const keys = Object.create(null);

let verticalVelocity = 0;
let grounded = true;
let walkTime = 0;

addEventListener('keydown', e => {
  keys[e.code] = true;

  if (e.code === 'Space') {
    e.preventDefault();

    if (grounded) {
      verticalVelocity = 8;
      grounded = false;
    }
  }
});

addEventListener('keyup', e => {
  keys[e.code] = false;
});

addEventListener('blur', () => {
  for (const key in keys) keys[key] = false;
});

// ======================================
// ORBIT CAMERA: MOUSE LOOK + ZOOM
// ======================================

// Camera yaw is independent of character rotation.
let cameraYaw = 0;
let cameraPitch = 0.18;

let targetZoom = 9;
let currentZoom = 9;

let dragging = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;

  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointerup', () => {
  dragging = false;
});

renderer.domElement.addEventListener('pointercancel', () => {
  dragging = false;
});

renderer.domElement.addEventListener('pointermove', e => {
  if (!dragging) return;

  cameraYaw -= (e.clientX - lastX) * 0.006;
  cameraPitch += (e.clientY - lastY) * 0.004;

  cameraPitch = THREE.MathUtils.clamp(
    cameraPitch, -1.0, 1.1
  );

  lastX = e.clientX;
  lastY = e.clientY;
});

// Mouse wheel zoom
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();

  targetZoom += e.deltaY * 0.012;
  targetZoom = THREE.MathUtils.clamp(targetZoom, 2.5, 22);
}, { passive: false });

// ======================================
// LATENCY SLIDER
// ======================================

const slider = document.getElementById('latency');
const pingLabel = document.getElementById('ping');
const delayLabel = document.getElementById('delay');

let latency = Number(slider.value);

slider.addEventListener('input', () => {
  latency = Number(slider.value);
  pingLabel.textContent = latency;
  delayLabel.textContent = latency;
});

// ======================================
// HISTORY FOR DELAYED GHOST
// ======================================

const history = [];
const clock = new THREE.Clock();

function saveState(time) {
  return {
    time,
    position: player.position.clone(),
    rotation: player.rotation.y,
    limbs: player.userData.limbs.map(
      limb => limb.rotation.x
    )
  };
}

function updateGhost(now) {
  const targetTime = now - latency;

  if (history.length < 2) return;

  let i = 0;

  while (
    i < history.length - 2 &&
    history[i + 1].time < targetTime
  ) {
    i++;
  }

  const a = history[i];
  const b = history[Math.min(i + 1, history.length - 1)];

  const span = b.time - a.time;
  const t = span > 0
    ? THREE.MathUtils.clamp((targetTime - a.time) / span, 0, 1)
    : 0;

  ghost.position.lerpVectors(a.position, b.position, t);

  // During jumps, the ghost can trail below the player,
  // but will never be positioned higher than the player.
  ghost.position.y = Math.min(
    ghost.position.y, player.position.y
  );

  const angleDifference = Math.atan2(
    Math.sin(b.rotation - a.rotation),
    Math.cos(b.rotation - a.rotation)
  );

  ghost.rotation.y = a.rotation + angleDifference * t;

  ghost.userData.limbs.forEach((limb, index) => {
    limb.rotation.x = THREE.MathUtils.lerp(
      a.limbs[index], b.limbs[index], t
    );
  });
}

// ======================================
// MOVEMENT AND SMOOTH TURNING
// ======================================

const direction = new THREE.Vector3();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();

const cameraTarget = new THREE.Vector3();
const lookTarget = new THREE.Vector3();

const MOVE_SPEED = 6;
const TURN_SPEED = 9;

function smoothAngle(current, target, amount) {
  const difference = Math.atan2(
    Math.sin(target - current),
    Math.cos(target - current)
  );

  return current + difference * amount;
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();

  // Movement is relative to camera direction.
  forward.set(
    -Math.sin(cameraYaw), 0, -Math.cos(cameraYaw)
  );

  right.set(
    Math.cos(cameraYaw), 0, -Math.sin(cameraYaw)
  );

  direction.set(0, 0, 0);

  if (keys.KeyW) direction.add(forward);
  if (keys.KeyS) direction.sub(forward);
  if (keys.KeyD) direction.add(right);
  if (keys.KeyA) direction.sub(right);

  const moving = direction.lengthSq() > 0;

  if (moving) {
    direction.normalize();

    player.position.addScaledVector(direction, MOVE_SPEED * dt);

    // Gradually turn instead of snapping to a new direction.
    const desiredRotation = Math.atan2(
      -direction.x, -direction.z
    );

    player.rotation.y = smoothAngle(
      player.rotation.y,
      desiredRotation,
      1 - Math.exp(-TURN_SPEED * dt)
    );

    // Walking animation
    walkTime += dt * 9;

    player.userData.legs[0].rotation.x =
      Math.sin(walkTime) * 0.6;

    player.userData.legs[1].rotation.x =
      -Math.sin(walkTime) * 0.6;

    player.userData.arms[0].rotation.x =
      -Math.sin(walkTime) * 0.4;

    player.userData.arms[1].rotation.x =
      Math.sin(walkTime) * 0.4;
  } else {
    player.userData.limbs.forEach(limb => {
      limb.rotation.x = THREE.MathUtils.damp(
        limb.rotation.x, 0, 10, dt
      );
    });
  }

  // Jump physics
  verticalVelocity -= 22 * dt;
  player.position.y += verticalVelocity * dt;

  if (player.position.y <= 0) {
    player.position.y = 0;
    verticalVelocity = 0;
    grounded = true;
  }

  // Record and replay past character states.
  history.push(saveState(now));
  updateGhost(now);

  while (
    history.length > 2 &&
    history[1].time < now - 1200
  ) {
    history.shift();
  }

  // Smooth camera zoom
  currentZoom = THREE.MathUtils.damp(
    currentZoom, targetZoom, 10, dt
  );

  // Orbit camera around the player
  const horizontalDistance = currentZoom *
    Math.cos(cameraPitch);

  cameraTarget.set(
    player.position.x +
      Math.sin(cameraYaw) * horizontalDistance,

    player.position.y + 2.5 +
      currentZoom * Math.sin(cameraPitch),

    player.position.z +
      Math.cos(cameraYaw) * horizontalDistance
  );

  camera.position.lerp(
    cameraTarget, 1 - Math.exp(-8 * dt)
  );

  lookTarget.set(
    player.position.x,
    player.position.y + 2.5,
    player.position.z
  );

  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
}

// ======================================
// RESIZE
// ======================================

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
