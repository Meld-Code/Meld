
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Latency Simulator</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 2;
      padding: 14px;
      width: 230px;
      color: white;
      background: rgba(15, 15, 20, 0.82);
      border: 1px solid #ffffff25;
      border-radius: 12px;
      line-height: 1.8;
      backdrop-filter: blur(8px);
    }

    #hud strong { color: #ff922e; }

    #latency {
      width: 100%;
      accent-color: #ff922e;
    }

    #help {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 2;
      padding: 10px 14px;
      color: white;
      background: rgba(15, 15, 20, 0.75);
      border-radius: 8px;
      font-size: 13px;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffffaa;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="hud">
    <strong>LATENCY SIMULATOR</strong><br />
    Simulated ping: <span id="ping">150</span> ms<br />
    Ghost delay: <span id="delay">150</span> ms

    <label for="latency">Latency amount</label>
    <input id="latency" type="range"
           min="50" max="1000" step="10" value="150" />

    <div>
      <span style="color:#ff922e">■</span>
      Orange = delayed position
    </div>
  </div>

  <div id="help">
    WASD: Move · Space: Jump · Drag mouse: Rotate camera
  </div>
  <div id="crosshair"></div>

  <script type="module">
    import * as THREE from 'three';
    import { RoundedBoxGeometry } from
      'three/addons/geometries/RoundedBoxGeometry.js';

    // ==========================================
    // SCENE AND RENDERER
    // ==========================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdedede);
    scene.fog = new THREE.Fog(0xdedede, 45, 120);

    const camera = new THREE.PerspectiveCamera(
      65, innerWidth / innerHeight, 0.1, 500
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);

    // ==========================================
    // LIGHTING
    // ==========================================

    scene.add(new THREE.HemisphereLight(
      0xffffff, 0x777777, 2.1
    ));

    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(8, 15, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    // ==========================================
    // GROUND
    // ==========================================

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshStandardMaterial({
        color: 0xb4b4b4,
        roughness: 1
      })
    );

    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(
      300, 100, 0x999999, 0xc8c8c8
    );

    grid.position.y = 0.012;
    scene.add(grid);

    // ==========================================
    // CLASSIC GRAY ROBLOX-STYLE CHARACTER
    // ==========================================

    function makeCharacter(isGhost = false) {
      const root = new THREE.Group();
      const body = new THREE.Group();
      root.add(body);

      const material = new THREE.MeshStandardMaterial({
        color: isGhost ? 0xff7900 : 0x999999,
        transparent: isGhost,
        opacity: isGhost ? 0.42 : 1,
        depthWrite: !isGhost,
        roughness: 0.85,
        metalness: 0
      });

      function block(size, position, parent = body, radius = 0.055) {
        const geometry = new RoundedBoxGeometry(
          size[0], size[1], size[2], 3, radius
        );

        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(...position);
        mesh.castShadow = !isGhost;
        mesh.receiveShadow = !isGhost;
        parent.add(mesh);

        return mesh;
      }

      // Featureless rounded head
      block(
        [0.86, 0.86, 0.86],
        [0, 2.83, 0],
        body,
        0.16
      );

      // Broad rectangular torso
      block(
        [1.35, 1.45, 0.62],
        [0, 1.68, 0],
        body,
        0.055
      );

      // Shoulder pivots and arms
      const leftArm = new THREE.Group();
      leftArm.position.set(-0.88, 2.25, 0);
      body.add(leftArm);

      block(
        [0.52, 1.38, 0.58],
        [0, -0.52, 0],
        leftArm
      );

      const rightArm = new THREE.Group();
      rightArm.position.set(0.88, 2.25, 0);
      body.add(rightArm);

      block(
        [0.52, 1.38, 0.58],
        [0, -0.52, 0],
        rightArm
      );

      // Leg pivots
      const leftLeg = new THREE.Group();
      leftLeg.position.set(-0.34, 0.96, 0);
      body.add(leftLeg);

      block(
        [0.62, 1.35, 0.62],
        [0, -0.48, 0],
        leftLeg
      );

      const rightLeg = new THREE.Group();
      rightLeg.position.set(0.34, 0.96, 0);
      body.add(rightLeg);

      block(
        [0.62, 1.35, 0.62],
        [0, -0.48, 0],
        rightLeg
      );

      root.userData.body = body;
      root.userData.arms = [leftArm, rightArm];
      root.userData.legs = [leftLeg, rightLeg];
      root.userData.limbs = [
        leftArm, rightArm, leftLeg, rightLeg
      ];

      return root;
    }

    const player = makeCharacter(false);
    scene.add(player);

    const ghost = makeCharacter(true);
    scene.add(ghost);

    // ==========================================
    // CONTROLS
    // ==========================================

    const keys = Object.create(null);

    let yaw = 0;
    let cameraPitch = 0.12;
    let verticalVelocity = 0;
    let grounded = true;
    let walkTime = 0;

    addEventListener('keydown', (event) => {
      keys[event.code] = true;

      if (event.code === 'Space') {
        event.preventDefault();

        if (grounded) {
          verticalVelocity = 8;
          grounded = false;
        }
      }
    });

    addEventListener('keyup', (event) => {
      keys[event.code] = false;
    });

    addEventListener('blur', () => {
      for (const key in keys) keys[key] = false;
    });

    // Mouse drag camera
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    renderer.domElement.addEventListener('pointerdown', (event) => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;

      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener('pointerup', () => {
      dragging = false;
    });

    renderer.domElement.addEventListener('pointercancel', () => {
      dragging = false;
    });

    renderer.domElement.addEventListener('pointermove', (event) => {
      if (!dragging) return;

      yaw -= (event.clientX - lastX) * 0.006;
      cameraPitch += (event.clientY - lastY) * 0.004;

      cameraPitch = THREE.MathUtils.clamp(
        cameraPitch, -0.25, 0.75
      );

      lastX = event.clientX;
      lastY = event.clientY;
    });

    // ==========================================
    // LATENCY SLIDER
    // ==========================================

    const slider = document.getElementById('latency');
    const pingLabel = document.getElementById('ping');
    const delayLabel = document.getElementById('delay');

    let latency = Number(slider.value);

    slider.addEventListener('input', () => {
      latency = Number(slider.value);
      pingLabel.textContent = latency;
      delayLabel.textContent = latency;
    });

    // ==========================================
    // DELAYED MOVEMENT HISTORY
    // ==========================================

    const history = [];
    const clock = new THREE.Clock();

    function snapshot(time) {
      return {
        time,
        position: player.position.clone(),
        rotation: player.rotation.y,

        limbRotations: player.userData.limbs.map(
          limb => limb.rotation.x
        )
      };
    }

    function updateGhost(now) {
      const targetTime = now - latency;

      if (history.length < 2) return;

      // Find the two historical frames surrounding the target time.
      let index = 0;

      while (
        index < history.length - 2 &&
        history[index + 1].time < targetTime
      ) {
        index++;
      }

      const a = history[index];
      const b = history[Math.min(index + 1, history.length - 1)];

      const span = b.time - a.time;

      const t = span > 0
        ? THREE.MathUtils.clamp(
            (targetTime - a.time) / span, 0, 1
          )
        : 0;

      ghost.position.lerpVectors(
        a.position, b.position, t
      );

      // Interpolate rotation along the shortest angle.
      const angleDifference = Math.atan2(
        Math.sin(b.rotation - a.rotation),
        Math.cos(b.rotation - a.rotation)
      );

      ghost.rotation.y = a.rotation + angleDifference * t;

      ghost.userData.limbs.forEach((limb, i) => {
        limb.rotation.x = THREE.MathUtils.lerp(
          a.limbRotations[i],
          b.limbRotations[i],
          t
        );
      });
    }

    // ==========================================
    // MAIN GAME LOOP
    // ==========================================

    const direction = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const cameraTarget = new THREE.Vector3();
    const lookTarget = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const now = performance.now();

      // Camera-relative movement
      forward.set(
        -Math.sin(yaw), 0, -Math.cos(yaw)
      );

      right.set(
        Math.cos(yaw), 0, -Math.sin(yaw)
      );

      direction.set(0, 0, 0);

      if (keys.KeyW) direction.add(forward);
      if (keys.KeyS) direction.sub(forward);
      if (keys.KeyD) direction.add(right);
      if (keys.KeyA) direction.sub(right);

      const moving = direction.lengthSq() > 0;

      if (moving) {
        direction.normalize();

        player.position.addScaledVector(
          direction, 6 * dt
        );

        player.rotation.y = Math.atan2(
          -direction.x, -direction.z
        );

        walkTime += dt * 9;

        player.userData.legs[0].rotation.x =
          Math.sin(walkTime) * 0.65;

        player.userData.legs[1].rotation.x =
          -Math.sin(walkTime) * 0.65;

        player.userData.arms[0].rotation.x =
          -Math.sin(walkTime) * 0.45;

        player.userData.arms[1].rotation.x =
          Math.sin(walkTime) * 0.45;
      } else {
        player.userData.limbs.forEach(limb => {
          limb.rotation.x = THREE.MathUtils.damp(
            limb.rotation.x, 0, 10, dt
          );
        });
      }

      // Jump and gravity
      verticalVelocity -= 22 * dt;
      player.position.y += verticalVelocity * dt;

      if (player.position.y <= 0) {
        player.position.y = 0;
        verticalVelocity = 0;
        grounded = true;
      }

      // Record current player state
      history.push(snapshot(now));

      // Update the orange delayed copy
      updateGhost(now);

      // Keep up to 1.2 seconds of history
      while (
        history.length > 2 &&
        history[1].time < now - 1200
      ) {
        history.shift();
      }

      // Third-person follow camera
      cameraTarget.set(
        player.position.x + Math.sin(yaw) * 8,
        player.position.y + 4.5 + cameraPitch * 3,
        player.position.z + Math.cos(yaw) * 8
      );

      camera.position.lerp(
        cameraTarget,
        1 - Math.exp(-5 * dt)
      );

      lookTarget.copy(player.position);
      lookTarget.y += 1.5;

      camera.lookAt(lookTarget);

      renderer.render(scene, camera);
    }

    // ==========================================
    // RESIZE
    // ==========================================

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(innerWidth, innerHeight);
    });

    pingLabel.textContent = latency;
    delayLabel.textContent = latency;

    animate();
  </script>
</body>
</html>
