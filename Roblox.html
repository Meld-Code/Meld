
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic Roblox R6 Latency Demo</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #dedede;
    }

    #hud {
      position: fixed;
      z-index: 5;
      top: 14px;
      left: 14px;
      width: 235px;
      padding: 14px;
      border-radius: 10px;
      color: white;
      background: #171717df;
      line-height: 1.8;
    }

    #hud strong { color: #ff8a22; }

    #latency {
      width: 100%;
      accent-color: #ff8a22;
    }

    #help {
      position: fixed;
      z-index: 5;
      bottom: 14px;
      left: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      color: white;
      background: #171717df;
      font-size: 13px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>

  <div id="hud">
    <strong>ROBLOX R6 LATENCY</strong><br />
    Simulated ping: <span id="ping">150</span> ms<br />
    Ghost delay: <span id="delay">150</span> ms<br />

    <label for="latency">Latency</label>
    <input id="latency" type="range"
           min="50" max="1000" step="10" value="150" />

    <span style="color:#ff8a22">■</span> Delayed character
  </div>

  <div id="help">
    WASD: Move | Space: Jump | Drag mouse: Rotate camera
  </div>

  <script type="module">
    import * as THREE from 'three';

    // ==========================================
    // SCENE
    // 1 unit = 28 cm
    // ==========================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdedede);

    const camera = new THREE.PerspectiveCamera(
      65, innerWidth / innerHeight, 0.1, 500
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(8, 15, 10);
    light.castShadow = true;
    scene.add(light);

    // ==========================================
    // GROUND
    // ==========================================

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshStandardMaterial({
        color: 0xd0d0d0,
        roughness: 1
      })
    );

    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(
      300, 100, 0xb0b0b0, 0xc7c7c7
    );

    grid.position.y = 0.01;
    scene.add(grid);

    // ==========================================
    // R6 CHARACTER
    //
    // Head:  2 x 1 x 1
    // Torso: 2 x 2 x 1
    // Arms:  1 x 2 x 1
    // Legs:  1 x 2 x 1
    //
    // Root is invisible and at ground level.
    // ==========================================

    function createCharacter(isGhost = false) {
      const root = new THREE.Group();
      const model = new THREE.Group();
      root.add(model);

      const material = new THREE.MeshStandardMaterial({
        color: isGhost ? 0xff851f : 0x999999,
        transparent: isGhost,
        opacity: isGhost ? 0.42 : 1,
        depthWrite: !isGhost,
        roughness: 0.9
      });

      // Invisible physics/root part: 2 x 2 x 1.
      // It is deliberately not added as a visible mesh.
      root.userData.rootPartSize = new THREE.Vector3(2, 2, 1);

      function part(name, size, position, parent = model) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(size[0], size[1], size[2]),
          material
        );

        mesh.name = name;
        mesh.position.set(...position);
        mesh.castShadow = !isGhost;
        mesh.receiveShadow = !isGhost;
        parent.add(mesh);

        return mesh;
      }

      // Classic R6 head: 56 x 28 x 28 cm.
      // No face, hair, accessories, or rounded toy shape.
      part('Head', [2, 1, 1], [0, 4.5, 0]);

      // Torso: 56 x 56 x 28 cm.
      part('Torso', [2, 2, 1], [0, 3, 0]);

      // Arms pivot at their shoulders.
      function makeArm(name, x) {
        const pivot = new THREE.Group();
        pivot.position.set(x, 4, 0);
        model.add(pivot);

        part(name, [1, 2, 1], [0, -1, 0], pivot);
        return pivot;
      }

      const leftArm = makeArm('Left Arm', -1.5);
      const rightArm = makeArm('Right Arm', 1.5);

      // Legs pivot at the hips.
      function makeLeg(name, x) {
        const pivot = new THREE.Group();
        pivot.position.set(x, 2, 0);
        model.add(pivot);

        part(name, [1, 2, 1], [0, -1, 0], pivot);
        return pivot;
      }

      const leftLeg = makeLeg('Left Leg', -0.5);
      const rightLeg = makeLeg('Right Leg', 0.5);

      root.userData.model = model;
      root.userData.arms = [leftArm, rightArm];
      root.userData.legs = [leftLeg, rightLeg];
      root.userData.limbs = [
        leftArm, rightArm, leftLeg, rightLeg
      ];

      return root;
    }

    const player = createCharacter(false);
    const ghost = createCharacter(true);

    scene.add(player, ghost);

    // ==========================================
    // INPUT
    // ==========================================

    const keys = Object.create(null);

    let yaw = 0;
    let pitch = 0.12;
    let verticalVelocity = 0;
    let grounded = true;
    let walkTime = 0;

    addEventListener('keydown', e => {
      keys[e.code] = true;

      if (e.code === 'Space') {
        e.preventDefault();

        if (grounded) {
          verticalVelocity = 8;
          grounded = false;
        }
      }
    });

    addEventListener('keyup', e => {
      keys[e.code] = false;
    });

    addEventListener('blur', () => {
      for (const k in keys) keys[k] = false;
    });

    // Mouse-drag camera
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    renderer.domElement.addEventListener('pointerdown', e => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    });

    renderer.domElement.addEventListener('pointerup', () => {
      dragging = false;
    });

    renderer.domElement.addEventListener('pointercancel', () => {
      dragging = false;
    });

    renderer.domElement.addEventListener('pointermove', e => {
      if (!dragging) return;

      yaw -= (e.clientX - lastX) * 0.006;
      pitch += (e.clientY - lastY) * 0.004;
      pitch = THREE.MathUtils.clamp(pitch, -0.2, 0.7);

      lastX = e.clientX;
      lastY = e.clientY;
    });

    // ==========================================
    // LATENCY CONTROL
    // ==========================================

    const slider = document.getElementById('latency');
    const pingLabel = document.getElementById('ping');
    const delayLabel = document.getElementById('delay');

    let latency = Number(slider.value);

    slider.addEventListener('input', () => {
      latency = Number(slider.value);
      pingLabel.textContent = latency;
      delayLabel.textContent = latency;
    });

    // ==========================================
    // POSITION HISTORY
    // ==========================================

    const history = [];
    const clock = new THREE.Clock();

    function saveState(time) {
      return {
        time,
        position: player.position.clone(),
        rotation: player.rotation.y,
        limbs: player.userData.limbs.map(
          limb => limb.rotation.x
        )
      };
    }

    function updateGhost(now) {
      const targetTime = now - latency;

      if (history.length < 2) return;

      let i = 0;

      while (
        i < history.length - 2 &&
        history[i + 1].time < targetTime
      ) {
        i++;
      }

      const a = history[i];
      const b = history[Math.min(i + 1, history.length - 1)];

      const duration = b.time - a.time;
      const t = duration > 0
        ? THREE.MathUtils.clamp(
            (targetTime - a.time) / duration, 0, 1
          )
        : 0;

      ghost.position.lerpVectors(a.position, b.position, t);

      // Prevent the ghost from appearing above the main character.
      // It can trail lower while the player jumps, but it won't
      // float above the player's current root height.
      ghost.position.y = Math.min(
        ghost.position.y, player.position.y
      );

      // Smooth rotation interpolation
      const angle = Math.atan2(
        Math.sin(b.rotation - a.rotation),
        Math.cos(b.rotation - a.rotation)
      );

      ghost.rotation.y = a.rotation + angle * t;

      ghost.userData.limbs.forEach((limb, index) => {
        limb.rotation.x = THREE.MathUtils.lerp(
          a.limbs[index], b.limbs[index], t
        );
      });
    }

    // ==========================================
    // MOVEMENT + CAMERA
    // ==========================================

    const direction = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const cameraTarget = new THREE.Vector3();
    const lookTarget = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const now = performance.now();

      forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
      right.set(Math.cos(yaw), 0, -Math.sin(yaw));

      direction.set(0, 0, 0);

      if (keys.KeyW) direction.add(forward);
      if (keys.KeyS) direction.sub(forward);
      if (keys.KeyA) direction.sub(right);
      if (keys.KeyD) direction.add(right);

      const moving = direction.lengthSq() > 0;

      if (moving) {
        direction.normalize();

        player.position.addScaledVector(direction, 6 * dt);

        player.rotation.y = Math.atan2(
          -direction.x, -direction.z
        );

        walkTime += dt * 9;

        player.userData.legs[0].rotation.x =
          Math.sin(walkTime) * 0.6;

        player.userData.legs[1].rotation.x =
          -Math.sin(walkTime) * 0.6;

        player.userData.arms[0].rotation.x =
          -Math.sin(walkTime) * 0.4;

        player.userData.arms[1].rotation.x =
          Math.sin(walkTime) * 0.4;
      } else {
        player.userData.limbs.forEach(limb => {
          limb.rotation.x = THREE.MathUtils.damp(
            limb.rotation.x, 0, 10, dt
          );
        });
      }

      // Jump physics
      verticalVelocity -= 22 * dt;
      player.position.y += verticalVelocity * dt;

      if (player.position.y <= 0) {
        player.position.y = 0;
        verticalVelocity = 0;
        grounded = true;
      }

      // Record player state and replay delayed state
      history.push(saveState(now));
      updateGhost(now);

      // Retain sufficient history for maximum slider delay
      while (
        history.length > 2 &&
        history[1].time < now - 1200
      ) {
        history.shift();
      }

      // Follow camera
      cameraTarget.set(
        player.position.x + Math.sin(yaw) * 8,
        player.position.y + 3.8 + pitch * 3,
        player.position.z + Math.cos(yaw) * 8
      );

      camera.position.lerp(
        cameraTarget, 1 - Math.exp(-5 * dt)
      );

      lookTarget.set(
        player.position.x,
        player.position.y + 2.5,
        player.position.z
      );

      camera.lookAt(lookTarget);

      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
